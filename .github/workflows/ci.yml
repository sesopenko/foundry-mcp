name: CI and releases
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read

env:
  DOCKER_BUILD_SUMMARY: 'false'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  DOCKER_BUILD_CHECKS_ANNOTATIONS: 'false'

jobs:
  verify:
    outputs:
      version: ${{ steps.build-info.outputs.version }}
      release_tag: ${{ steps.build-info.outputs.release_tag }}
      revision: ${{ steps.build-info.outputs.revision }}
      build_kind: ${{ steps.build-info.outputs.build_kind }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and validate packaged build identity
        id: build-info
        run: python scripts/build-metadata.py --github-output "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.9.16'
      - run: uv python install 3.12
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./scripts/test.sh
      - name: Validate release assets and synchronized version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            .venv/bin/python scripts/package-module.py --tag "$REF_NAME" --revision "$GITHUB_SHA"
          else
            .venv/bin/python scripts/package-module.py --revision "$GITHUB_SHA"
          fi
      - name: Build and start isolated production image
        env:
          BUILD_VERSION: ${{ steps.build-info.outputs.version }}
          BUILD_RELEASE_TAG: ${{ steps.build-info.outputs.release_tag }}
          BUILD_REVISION: ${{ steps.build-info.outputs.revision }}
        run: |
          docker compose -p foundry-mcp-smoke -f deploy/compose.local.yaml build --build-arg VERSION="$BUILD_VERSION" --build-arg RELEASE_TAG="$BUILD_RELEASE_TAG" --build-arg REVISION="$BUILD_REVISION"
          docker compose -p foundry-mcp-smoke -f deploy/compose.local.yaml up -d --no-build --wait --wait-timeout 90
      - name: Protocol-aware container smoke test
        run: .venv/bin/python scripts/container-smoke.py
      - name: Verify private PDF uploads, retrieval and persistent volumes
        run: |
          docker compose -p foundry-mcp-smoke -f deploy/compose.local.yaml up -d --no-build --wait --wait-timeout 90 pdf-library-test
          docker compose -p foundry-mcp-smoke -f deploy/compose.local.yaml run --rm --no-deps -T pdf-smoke
          docker compose -p foundry-mcp-smoke -f deploy/compose.local.yaml up -d --no-build --force-recreate --wait --wait-timeout 90 pdf-library-test
          docker compose -p foundry-mcp-smoke -f deploy/compose.local.yaml run --rm --no-deps -T pdf-smoke --verify-only
      - name: Verify graceful shutdown
        run: |
          docker compose -p foundry-mcp-smoke -f deploy/compose.local.yaml stop
          test "$(docker inspect foundry-mcp-smoke-foundry-mcp-1 --format '{{.State.ExitCode}}')" = 0
      - name: Clean up isolated test service
        if: always()
        run: docker compose -p foundry-mcp-smoke -f deploy/compose.local.yaml down
      - uses: actions/upload-artifact@v4
        with:
          name: foundry-module
          path: |
            dist/module/module.json
            dist/module/foundry-mcp.zip
          if-no-files-found: error

  push-image:
    needs: verify
    if: >-
      github.repository == 'sesopenko/foundry-mcp' &&
      github.event_name == 'push' && vars.PUSH_IMAGE_ENABLED == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python - <<'PYTHON'
          import os
          if not os.environ['DOCKERHUB_USERNAME'] or not os.environ['DOCKERHUB_TOKEN']:
              raise SystemExit('Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets')
          PYTHON
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Refuse replacement of a release image
        if: github.ref_type == 'tag'
        env:
          RELEASE_IMAGE: docker.io/sesopenko/foundry-mcp:${{ github.ref_name }}
        run: python scripts/check-image-tag.py
      - name: Preserve an existing immutable commit image
        id: commit-image
        env:
          RELEASE_IMAGE: docker.io/sesopenko/foundry-mcp:sha-${{ github.sha }}
        run: python scripts/check-image-tag.py --skip-existing
      - name: Push commit image
        if: steps.commit-image.outputs.push == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            RELEASE_TAG=${{ needs.verify.outputs.release_tag }}
            REVISION=${{ needs.verify.outputs.revision }}
          tags: docker.io/sesopenko/foundry-mcp:sha-${{ github.sha }}
      - name: Push release image
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            RELEASE_TAG=${{ needs.verify.outputs.release_tag }}
            REVISION=${{ needs.verify.outputs.revision }}
          tags: |
            docker.io/sesopenko/foundry-mcp:${{ github.ref_name }}
            docker.io/sesopenko/foundry-mcp:latest

  release-module:
    needs: verify
    if: >-
      github.repository == 'sesopenko/foundry-mcp' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foundry-module
          path: dist/module
      - name: Verify module artifact belongs to this release tag and commit
        run: python scripts/build-metadata.py --archive dist/module/foundry-mcp.zip
      - name: Create versioned release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --latest --title "$RELEASE_TAG" \
            --notes 'Install with the stable module manifest. See docs/operations.md for deployment, compatibility, upgrade, and rollback instructions.' \
            dist/module/module.json dist/module/foundry-mcp.zip
      - name: Check anonymous public downloads
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          curl -fLsS --retry 3 --retry-delay 2 --output /tmp/module.json \
            "https://github.com/sesopenko/foundry-mcp/releases/download/$RELEASE_TAG/module.json"
          curl -fLsS --retry 3 --retry-delay 2 --output /tmp/foundry-mcp.zip \
            "https://github.com/sesopenko/foundry-mcp/releases/download/$RELEASE_TAG/foundry-mcp.zip"
          cmp dist/module/module.json /tmp/module.json
          cmp dist/module/foundry-mcp.zip /tmp/foundry-mcp.zip
          curl -fLsS --retry 3 --retry-delay 2 --output /tmp/latest-module.json \
            'https://github.com/sesopenko/foundry-mcp/releases/latest/download/module.json'
          cmp dist/module/module.json /tmp/latest-module.json

  code-graph-debian:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install Debian bootstrap prerequisites
        run: apt-get update && apt-get install -y ca-certificates curl git nodejs npm python3 ripgrep util-linux
      - uses: actions/checkout@v4
      - name: Trust the mounted checkout for container shell steps
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Bootstrap without Codex, Docker, Foundry or models
        shell: bash
        run: |
          ./scripts/dev-setup.sh
          ./scripts/dev-setup.sh
          git diff --exit-code
          cat /etc/os-release
          uname -m
          node --version
          npm --version
          "$HOME/.local/bin/uv" --version
          .venv/bin/python --version
          ./scripts/code-graph.sh --version
      - name: Exercise native graph contracts in disposable fixtures
        shell: bash
        run: CODE_GRAPH_INTEGRATION=1 .venv/bin/python -m unittest discover -s tests -p test_code_graph.py -v
