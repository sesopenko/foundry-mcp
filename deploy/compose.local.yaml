# Local container build/smoke checks; independent of the managed dev server.
services:
  foundry-mcp:
    image: foundry-mcp:local
    build:
      context: ..
      args:
        VERSION: 2.2.0
    # Public synthetic credentials for isolated tests ONLY; never deploy these.
    environment:
      FOUNDRY_MCP_AUTH_MODE: basic
      FOUNDRY_MCP_BASIC_USERNAME: smoke
      FOUNDRY_MCP_BASIC_PASSWORD: smoke-password-for-isolated-tests-only
      FOUNDRY_MCP_BRIDGE_TOKEN: smoke-browser-token-for-isolated-tests-only
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:18000:8000"
    stop_grace_period: 15s

  smoke:
    image: foundry-mcp:local
    profiles: [checks]
    entrypoint: [python, /checks/container-smoke.py, --url, 'http://foundry-mcp:8000']
    volumes:
      - ../scripts/container-smoke.py:/checks/container-smoke.py:ro

  pdf-library-test:
    image: foundry-mcp:local
    profiles: [checks]
    environment:
      FOUNDRY_MCP_AUTH_MODE: basic
      FOUNDRY_MCP_BASIC_USERNAME: smoke
      FOUNDRY_MCP_BASIC_PASSWORD: smoke-password
      FOUNDRY_MCP_BRIDGE_TOKEN: smoke-bridge
      FOUNDRY_MCP_PDF_ENABLED: "true"
      FOUNDRY_MCP_PDF_TRUSTED_GM_MCP: "true"
      FOUNDRY_MCP_PDF_UPLOAD_ENABLED: "true"
      FOUNDRY_MCP_PDF_UPLOAD_TOKEN: smoke-private-upload
      FOUNDRY_MCP_PDF_LIBRARY_DIR: /data/pdf-library
      FOUNDRY_MCP_PDF_INDEX_DIR: /data/pdf-state
      # Isolated CI network only; no published ports or real document corpus.
      FOUNDRY_MCP_PDF_TRUST_TLS_PROXY: "true"
    volumes:
      - pdf-test-books:/data/pdf-library
      - pdf-test-state:/data/pdf-state

  pdf-smoke:
    image: foundry-mcp:local
    profiles: [checks]
    entrypoint: [python, /checks/pdf-smoke.py, 'http://pdf-library-test:8000']
    volumes:
      - ../scripts/pdf-smoke.py:/checks/pdf-smoke.py:ro

volumes:
  pdf-test-books:
  pdf-test-state:
