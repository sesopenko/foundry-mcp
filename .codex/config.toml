# Loaded only for Codex sessions in this trusted repository.
[mcp_servers.grounded-docs]
command = "bash"
args = ["./scripts/docs-mcp.sh"]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 120

[mcp_servers.grounded-docs.tools.scrape_docs]
approval_mode = "approve"

[mcp_servers.foundry-vtt]
url = "http://127.0.0.1:8000/mcp/mcp"
bearer_token_env_var = "FOUNDRY_MCP_CALLER_TOKEN"
enabled = true

[mcp_servers.foundry-vtt.tools.get_player_names]
approval_mode = "approve"

[mcp_servers.foundry-vtt.tools.execute_javascript]
approval_mode = "approve"

[mcp_servers.foundry-vtt.tools.get_journal_tree]
approval_mode = "approve"

[mcp_servers.foundry-vtt.tools.search_journals]
approval_mode = "approve"

[mcp_servers.foundry-vtt.tools.get_journal_contents]
approval_mode = "approve"

[mcp_servers.foundry-vtt.tools.read_journal_page]
approval_mode = "approve"

# Enabled only by scripts/codex-dev.sh for active Foundry development.
[mcp_servers.chrome-devtools]
command = "bash"
args = ["./scripts/chrome-devtools.sh"]
enabled = false
startup_timeout_sec = 30
tool_timeout_sec = 60

[mcp_servers.code-graph]
command = "bash"
args = ["./scripts/code-graph.sh", "serve"]
enabled = true
required = false
startup_timeout_sec = 60
tool_timeout_sec = 120
enabled_tools = ["project_map", "module_overview", "get_ast_node", "get_call_graph", "find_references", "semantic_code_search", "ast_search"]

[mcp_servers.code-graph.tools.get_ast_node]
approval_mode = "approve"

[mcp_servers.code-graph.tools.module_overview]
approval_mode = "approve"
