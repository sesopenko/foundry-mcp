---
version: "3.8"

services:
  foundry:
    image: felddy/foundryvtt:release
    hostname: ${FOUNDRY_HOSTNAME:-my_foundry_host}
    restart: "no"
    user: 1000:1000
    volumes:
      - ./foundry-data:/data
      - ./foundry-module:/data/Data/modules/foundry-mcp/:ro
    environment:
      - FOUNDRY_PASSWORD=${FOUNDRY_PASSWORD:?set in .env}
      - FOUNDRY_USERNAME=${FOUNDRY_USERNAME:?set in .env}
      - FOUNDRY_ADMIN_KEY=${FOUNDRY_ADMIN_KEY:?set in .env}
      - FOUNDRY_LICENSE_KEY=${FOUNDRY_LICENSE_KEY:?set in .env}
      - FOUNDRY_PROXY_PORT=${FOUNDRY_PROXY_PORT:-443}
      - FOUNDRY_PROXY_SSL=${FOUNDRY_PROXY_SSL:-true}
      - FOUNDRY_MINIFY_STATIC_FILES=${FOUNDRY_MINIFY_STATIC_FILES:-true}
      - FOUNDRY_PRESERVE_CONFIG=${FOUNDRY_PRESERVE_CONFIG:-true}
      - FOUNDRY_VERSION=${FOUNDRY_VERSION:-13.351}
    ports:
      - target: 30000
        published: 30000
        protocol: tcp
