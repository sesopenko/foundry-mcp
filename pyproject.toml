[project]
name = "foundry-mcp"
version = "1.2.0"
description = "MCP bridge to Foundry VTT over WebSockets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.128.0",
    "fastmcp==2.14.1",
    "uvicorn==0.40.0",
]

[tool.uv]
package = false
# Pydocket 0.15.5 imports FakeServer from fakeredis.aioredis.
constraint-dependencies = ["fakeredis==2.32.1"]
